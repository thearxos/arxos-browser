// ARXOS Firefox hardening (autoconfig) — aggressive, workstation-usable.
// Applied globally via /usr/lib/firefox/defaults/pref/autoconfig.js -> this file.
// lockPref = user cannot change; defaultPref = hardened default the user may override.
// Trade-offs noted inline; this is the "super secure" posture the ARXOS default ships.

// ---- telemetry / data collection: OFF and locked ----
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.unified", false);
lockPref("toolkit.telemetry.archive.enabled", false);
lockPref("toolkit.telemetry.newProfilePing.enabled", false);
lockPref("toolkit.telemetry.shutdownPingSender.enabled", false);
lockPref("toolkit.telemetry.coverage.opt-out", true);
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("datareporting.policy.dataSubmissionEnabled", false);
lockPref("app.shield.optoutstudies.enabled", false);
lockPref("app.normandy.enabled", false);
lockPref("breakpad.reportURL", "");
lockPref("browser.tabs.crashReporting.sendReport", false);

// ---- anti-fingerprinting (RFP is the strong one; forces light theme + UTC, that is the cost) ----
defaultPref("privacy.resistFingerprinting", true);
// LETTERBOXING ON: exact inner-window dimensions are one of the highest-entropy fingerprint
// bits and stable across Tor circuits. Tor Browser ships this on; a privacy OS must too.
defaultPref("privacy.resistFingerprinting.letterboxing", true);
defaultPref("privacy.fingerprintingProtection", true);
defaultPref("webgl.disabled", false); // leave WebGL on (RFP already spoofs it); tools need canvas
defaultPref("privacy.resistFingerprinting.block_mozAddonManager", true);
defaultPref("javascript.use_us_english_locale", true);
defaultPref("intl.accept_languages", "en-US, en");
defaultPref("intl.locale.requested", "en-US");
defaultPref("layout.css.font-visibility.private", 1);
defaultPref("layout.css.font-visibility.standard", 1);
defaultPref("layout.css.font-visibility.resistFingerprinting", 1);
defaultPref("gfx.font_rendering.opentype_svg.enabled", false);
defaultPref("media.eme.enabled", false);
defaultPref("media.gmp-widevinecdm.enabled", false);
defaultPref("media.gmp-widevinecdm.visible", false);
defaultPref("media.navigator.mediadatadecoder_vpx_enabled", false);
defaultPref("dom.netinfo.enabled", false);
// AudioContext fingerprint: RFP injects uniform noise into the Web Audio waveform hash; keep the
// API on (disabling breaks legit audio) and coarsen the timers/device-enumeration it leaks.
defaultPref("dom.webaudio.enabled", true);
defaultPref("media.ondevicechange.enabled", false);
defaultPref("privacy.resistFingerprinting.reduceTimerPrecision.unconditional", true);

// ---- tracking protection: strict ----
defaultPref("browser.contentblocking.category", "strict");
defaultPref("privacy.trackingprotection.enabled", true);
defaultPref("privacy.trackingprotection.socialtracking.enabled", true);
defaultPref("privacy.trackingprotection.cryptomining.enabled", true);
defaultPref("privacy.trackingprotection.fingerprinting.enabled", true);

// ---- cookies: block cross-site trackers + partition the rest (total cookie protection) ----
defaultPref("network.cookie.cookieBehavior", 5);
defaultPref("privacy.partition.serviceWorkers", true);
defaultPref("privacy.partition.network_state.ocsp_cache", true);

// ---- WebRTC: leave on, but never leak the local/private IP ----
// ice.proxy_only_if_behind_proxy only engages when Firefox's OWN proxy settings show
// a configured proxy. anond routes traffic transparently at the nftables level, not
// through Firefox's proxy settings, so Firefox never considers itself "behind a
// proxy" and that guard never actually engages — WebRTC's direct UDP ICE candidates
// can still leak the real public IP while anond/Tor is active. ice.proxy_only is
// unconditional (the same setting Tor Browser itself uses): with no proxy configured,
// it fails CLOSED — WebRTC calls may simply not connect rather than leak.
defaultPref("media.peerconnection.enabled", true);
defaultPref("media.peerconnection.ice.default_address_only", true);
defaultPref("media.peerconnection.ice.no_host", true);
defaultPref("media.peerconnection.ice.proxy_only", true);

// ---- prefetch / speculative connections: OFF (privacy + no phantom requests) ----
lockPref("network.prefetch-next", false);
lockPref("network.dns.disablePrefetch", true);
lockPref("network.dns.disablePrefetchFromHTTPS", true);
lockPref("network.predictor.enabled", false);
lockPref("network.predictor.enable-prefetch", false);
lockPref("network.http.speculative-parallel-limit", 0);
lockPref("browser.urlbar.speculativeConnect.enabled", false);
lockPref("browser.places.speculativeConnect.enabled", false);

// ---- HTTPS-only + secure transport ----
defaultPref("dom.security.https_only_mode", true);
defaultPref("dom.security.https_only_mode_ever_enabled", true);
defaultPref("security.ssl.require_safe_negotiation", true);
defaultPref("security.tls.enable_0rtt_data", false);
defaultPref("security.OCSP.enabled", 1);

// ---- referer: trim + do not leak across origins ----
defaultPref("network.http.referer.XOriginPolicy", 2);
defaultPref("network.http.referer.XOriginTrimmingPolicy", 2);
defaultPref("network.http.referer.trimmingPolicy", 2);

// ---- disable location, sensors, autofill, password nags (a workstation, not a personal browser) ----
defaultPref("geo.enabled", false);
defaultPref("permissions.default.geo", 2);
defaultPref("device.sensors.enabled", false);
defaultPref("extensions.formautofill.addresses.enabled", false);
defaultPref("extensions.formautofill.creditCards.enabled", false);
defaultPref("signon.rememberSignons", false);
defaultPref("signon.autofillForms", false);

// ---- new tab / home: no sponsored, no snippets, no pocket ----
lockPref("browser.newtabpage.activity-stream.showSponsored", false);
lockPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false);
lockPref("browser.newtabpage.activity-stream.feeds.section.topstories", false);
lockPref("browser.newtabpage.activity-stream.feeds.snippets", false);
lockPref("extensions.pocket.enabled", false);

// ---- DNS: deferred to the SYSTEM resolver, not Firefox's own DoH ----
// Firefox's built-in DoH runs over 443 straight to Quad9's servers, completely
// bypassing anond's DNS-pinned-to-Tor protection (anond's nftables redirect only
// catches port 53). With TRR off, Firefox always asks the system resolver, which is
// whatever anond has pinned when it's active (Tor) — the same fix Tor Browser itself
// makes (it disables Firefox's built-in DoH and resolves through Tor instead).
defaultPref("network.trr.mode", 5); // 5 = explicitly disabled by policy, not just "off by default"

// ---- startup: always the ARXOS homepage, never a stale crash-restore session ----
defaultPref("browser.startup.page", 1);
defaultPref("browser.startup.homepage", "file:///usr/share/arxos/browser/welcome.html");
defaultPref("browser.sessionstore.resume_from_crash", false);

// ---- misc hardening ----
defaultPref("browser.safebrowsing.downloads.remote.enabled", false); // no upload of DLs to Google
defaultPref("beacon.enabled", false);
defaultPref("browser.send_pings", false);
defaultPref("dom.battery.enabled", false);
defaultPref("network.IDN_show_punycode", true); // anti-phishing
defaultPref("pdfjs.enableScripting", false);

// ---- ARXOS dark chrome, WITHOUT leaking a dark bit to websites ----
// The browser UI is dark. Websites are deliberately NOT forced dark: resistFingerprinting
// pins prefers-color-scheme to LIGHT for every RFP user so they all answer alike. Forcing
// content dark (layout.css.prefers-color-scheme.content-override = 0) overrides that pin, so
// every ArxOS browser would answer "dark" while the rest of the RFP crowd answers "light" - a
// stable, trivially-read bit that shrinks the anonymity set and helps re-link sessions across
// Tor circuits. That is the same class of leak letterboxing is turned on above to prevent, so
// paying it for aesthetics would contradict this file. Per the ArxOS priority order (end-user
// security outranks convenience and aesthetics), content follows RFP. The chrome prefs below
// are browser-local and are not exposed to pages.
lockPref("ui.systemUsesDarkTheme", 1);
lockPref("browser.theme.toolbar-theme", 0);
lockPref("browser.theme.content-theme", 0);
// exemptedDomains is a per-DOMAIN allowlist of sites that bypass RFP entirely. Empty means no
// site is exempt, which is what we want. It has nothing to do with color-scheme; the comment
// that used to sit here claimed it exempted color-scheme from RFP, which it does not.
defaultPref("privacy.resistFingerprinting.exemptedDomains", "");
defaultPref("widget.content.allow-gtk-dark-theme", true);
// To force dark websites anyway, accepting that fingerprint cost, re-add:
//   lockPref("layout.css.prefers-color-scheme.content-override", 0);

// ---- additional hardening (no phone-home, stronger transport, less attack surface) ----
lockPref("network.connectivity-service.enabled", false);       // no Mozilla connectivity ping
lockPref("network.captive-portal-service.enabled", false);     // no captive-portal phone-home
lockPref("captivedetect.canonicalURL", "");
lockPref("toolkit.telemetry.server", "data:,");                // dead-end any stray telemetry
lockPref("toolkit.coverage.endpoint.base", "");
lockPref("browser.ping-centre.telemetry", false);
// Level 1, not 2, and deliberately: 1 still enforces key pinning for every chain that ends at
// a BUILT-IN root - the real threat, a mis-issuing or compromised public CA - but stops
// enforcing it when the chain ends at a root the USER installed. Level 2 enforces even then,
// which breaks intercepting your own traffic with Burp Suite or mitmproxy on pinned sites, a
// core workflow on this distro. 1 is also Firefox's own default, for the same reason.
lockPref("security.cert_pinning.enforcement_level", 1);
lockPref("security.pki.sha1_enforcement_level", 1);            // reject SHA-1 certs
lockPref("dom.security.https_only_mode_send_http_background_request", false);
lockPref("network.http.referer.hideOnionSource", true);
lockPref("dom.push.enabled", false);                           // no web push
lockPref("dom.push.connection.enabled", false);
lockPref("dom.serviceWorkers.enabled", true);                  // keep (many tools need it), but push is off
lockPref("dom.event.clipboardevents.enabled", false);         // sites cannot read copy/paste events
lockPref("media.navigator.enabled", true);                    // cam/mic usable but gated by permission
lockPref("security.family_safety.mode", 0);
lockPref("browser.contentblocking.report.lockwise.enabled", false);
lockPref("browser.contentblocking.report.monitor.enabled", false);
lockPref("extensions.getAddons.showPane", false);
lockPref("extensions.htmlaboutaddons.recommendations.enabled", false);
lockPref("browser.discovery.enabled", false);
lockPref("browser.aboutConfig.showWarning", false);
lockPref("webgl.enable-debug-renderer-info", false);          // no unmasked GPU string

// ---- ARXOS default theme: "Praise the sun (animated)" (Solaire) ----
// Shipped in firefox/themes/praise-the-sun-animated.xpi; install.sh drops it into the
// system distribution extensions so it is the active theme on first run.
lockPref("extensions.activeThemeID", "{51fd00e2-c195-4740-824f-c8e789b1c066}");

// ---- ARXOS look: dark chrome + gold accent (matches the desktop) ----
lockPref("browser.theme.toolbar-theme", 0);   // 0 = dark toolbar
lockPref("browser.theme.content-theme", 0);   // 0 = dark content
lockPref("ui.systemUsesDarkTheme", 1);
lockPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
// drop an ARXOS gold-accent userChrome.css into the active profile on startup
try {
  const {classes:Cc, interfaces:Ci} = Components;
  let ch = Cc["@mozilla.org/file/directory_service;1"].getService(Ci.nsIProperties).get("ProfD", Ci.nsIFile);
  ch.append("chrome");
  if (!ch.exists()) ch.create(Ci.nsIFile.DIRECTORY_TYPE, 0o755);
  let css = ch.clone(); css.append("userChrome.css");
  let data = [
    "/* ARXOS accent */",
    ":root{--arxos-accent:#e8702a}",
    '.tabbrowser-tab[selected] .tab-line,.tab-line[selected="true"]{background-color:var(--arxos-accent)!important}',
    '#urlbar[focused="true"] > #urlbar-background{border-color:var(--arxos-accent)!important;box-shadow:0 0 0 1px var(--arxos-accent)!important}',
    "#nav-bar{border-top:2px solid var(--arxos-accent)!important}"
  ].join("\n");
  let fos = Cc["@mozilla.org/network/file-output-stream;1"].createInstance(Ci.nsIFileOutputStream);
  fos.init(css, 0x02|0x08|0x20, 0o644, 0);
  fos.write(data, data.length); fos.close();
} catch(e) {}

